name: RE4 Pak Auto Extractor macos Ultimate Fix

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  extract-and-unpack-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install IPSW via Homebrew (The Safest Way for macOS)
      run: |
        echo "Installing ipsw using native macOS Homebrew..."
        # blacktop-এর অফিসিয়াল ট্যাপ অ্যাড করে ipsw ইনস্টল করা
        brew tap blacktop/tap
        brew install ipsw

    - name: Download and Extract IPA
      run: |
        curl -L -o app.ipa "https://github.com/Doann7457/tai-ipa/releases/download/jp.co.capcom.RE4US-6462360082-863325402/jp.co.capcom.RE4US-1.0.2-6462360082-863325402.ipa"
        mkdir -p extracted_ipa
        # ম্যাকের নেটিভ 7z দিয়ে সেফলি আনজিপ করা
        7z x app.ipa -oextracted_ipa/ -y

    - name: Full Extraction of Mach-O Binary Structure
      run: |
        # হোমব্রু এর ডিফল্ট গ্লোবাল পাথ এনভায়রনমেন্ট সেট করা (Apple Silicon/Intel দুটোর জন্যই সেফ)
        export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
        
        BINARY_PATH=$(find extracted_ipa/ -path "*/Resident Evil 4.app/Resident Evil 4" -print -quit)
        
        if [ -n "$BINARY_PATH" ]; then
            echo "Found target binary at: $BINARY_PATH"
            mkdir -p Full_Binary_Extraction
            
            echo "1. Extracting structural overview and segments..."
            ipsw macho info "$BINARY_PATH" > Full_Binary_Extraction/macho_segments_layout.txt || true
            
            echo "2. De-compiling class templates and interfaces..."
            ipsw macho class-dump "$BINARY_PATH" > Full_Binary_Extraction/reconstructed_classes.h || true
            
            echo "3. Disassembling execution instructions via Native macOS Toolchain..."
            otool -tV "$BINARY_PATH" > Full_Binary_Extraction/disassembled_machine_code.asm || true
            
            echo "4. Checking entitlements and code signing..."
            ipsw macho ent "$BINARY_PATH" > Full_Binary_Extraction/entitlements.json || true
            
            zip -r re4_fully_extracted_macho.zip Full_Binary_Extraction/
            echo "Success: Compiled data fully extracted into re4_fully_extracted_macho.zip"
        else
            echo "CRITICAL ERROR: 'Resident Evil 4' binary file could not be found!"
            exit 1
        fi

    - name: Save Fully Extracted Mach-O Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Resident-Evil-4-macOS-Extracted-Binary
        path: re4_fully_extracted_macho.zip
        retention-days: 3
