name: RE4 Pak Auto Extractor ubuntu

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # জব ১: আপনার আগের উবুন্টু জব (অ্যাসেম্বলি ও ক্লাস ডাম্পের জন্য)
  extract-and-unpack:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Toolchains and System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y unrar p7zip-full zip binutils llvm clang

    - name: Install IPSW Mach-O Analyzer Engine
      run: |
        curl -sS https://webi.sh/ipsw | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Download and Extract IPA
      run: |
        curl -L -o app.ipa "https://github.com/Doann7457/tai-ipa/releases/download/jp.co.capcom.RE4US-6462360082-863325402/jp.co.capcom.RE4US-1.0.2-6462360082-863325402.ipa"
        mkdir -p extracted_ipa
        unzip app.ipa -d extracted_ipa/

    - name: Full Extraction of Mach-O Binary Structure
      run: |
        BINARY_PATH=$(find extracted_ipa/ -path "*/Resident Evil 4.app/Resident Evil 4" -print -quit)
        if [ -n "$BINARY_PATH" ]; then
            mkdir -p Full_Binary_Extraction
            ipsw macho info "$BINARY_PATH" > Full_Binary_Extraction/macho_segments_layout.txt || true
            ipsw macho class-dump "$BINARY_PATH" > Full_Binary_Extraction/reconstructed_classes.h || true
            llvm-objdump -d --macho --demangle "$BINARY_PATH" > Full_Binary_Extraction/disassembled_machine_code.asm || true
            ipsw macho ent "$BINARY_PATH" > Full_Binary_Extraction/entitlements.json || true
            zip -r re4_fully_extracted_macho.zip Full_Binary_Extraction/
        else
            echo "CRITICAL ERROR: 'Resident Evil 4' binary file could not be found!"
            exit 1
        fi

    # পরবর্তী জবে ফাইলটি পাঠানোর জন্য সাময়িকভাবে র-বাইনারিটি আপলোড করা
    - name: Share Binary for macOS Job
      uses: actions/upload-artifact@v4
      with:
        name: raw-re4-binary
        path: extracted_ipa/Payload/Resident Evil 4.app/Resident Evil 4
        retention-days: 1

  # জব ২: নতুন macOS জব যা Ghidra দিয়ে C-কোড ডিকম্পাইল করবে
  ghidra-decompile:
    needs: extract-and-unpack
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java (Required for Ghidra)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download and Install Ghidra
      run: |
        echo "Downloading Ghidra..."
        curl -L -o ghidra.zip "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.1.2_build/ghidra_11.1.2_PUBLIC_20240709.zip"
        unzip ghidra.zip
        mv ghidra_11.1.2_PUBLIC Ghidra
        echo "$(pwd)/Ghidra/support" >> $GITHUB_PATH

    - name: Download Raw Binary from previous job
      uses: actions/download-artifact@v4
      with:
        name: raw-re4-binary
        path: ./target_binary

    - name: Run Ghidra Headless Decompiler
      run: |
        mkdir -p Ghidra_Project
        mkdir -p Decompiled_Output
        
        # Ghidra Headless কমান্ড রান করা
        # এটি প্রজেক্ট তৈরি করবে, ARM64 Mach-O ফাইল ইমপোর্ট করবে এবং ডি-কম্পাইল স্ক্রিপ্ট চালাবে
        ./Ghidra/support/analyzeHeadless Ghidra_Project RE4_Analysis \
          -import ./target_binary/Resident\ Evil\ 4 \
          -postScript Decompile.java ./Decompiled_Output/pseudo_code.c \
          -deleteProject || true

    - name: Zip Decompiled C Code
      run: |
        zip -r re4_ghidra_decompiled_c.zip Decompiled_Output/

    - name: Save Ghidra Decompiled Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Resident-Evil-4-Ghidra-C-Code
        path: re4_ghidra_decompiled_c.zip
        retention-days: 3
